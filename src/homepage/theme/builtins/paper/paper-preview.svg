<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 224" role="img" aria-label="Paper workspace theme preview">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.017 0.31" numOctaves="4" seed="41" stitchTiles="stitch" result="fibres"/>
      <feColorMatrix in="fibres" type="matrix" values=".16 .16 .16 0 .24 .14 .14 .14 0 .20 .11 .11 .11 0 .15 0 0 0 .028 0" result="fibres-toned"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="19" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".18 .18 .18 0 .22 .16 .16 .16 0 .18 .13 .13 .13 0 .13 0 0 0 .095 0" result="grain-toned"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.031" numOctaves="4" seed="61" stitchTiles="stitch" result="mottle"/>
      <feColorMatrix in="mottle" type="matrix" values=".17 .17 .17 0 .23 .15 .15 .15 0 .19 .12 .12 .12 0 .14 0 0 0 .04 0" result="mottle-toned"/>
      <feMerge><feMergeNode in="fibres-toned"/><feMergeNode in="grain-toned"/><feMergeNode in="mottle-toned"/></feMerge>
    </filter>
    <linearGradient id="banner" x1="0" x2="1">
      <stop offset="0" stop-color="#d9d0c1"/>
      <stop offset="0.5" stop-color="#f2ede4"/>
      <stop offset="1" stop-color="#b9aa96"/>
    </linearGradient>
    <filter id="preview-deckle" x="-3%" y="-12%" width="106%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .24" numOctaves="3" seed="47" result="edge-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="edge-noise" scale="3.6" xChannelSelector="R" yChannelSelector="G" result="rough-paper"/>
      <feDropShadow in="rough-paper" dx="0" dy="2.5" stdDeviation="2.4" flood-color="#4d4032" flood-opacity=".22" result="paper-shadow"/>
      <feMerge><feMergeNode in="paper-shadow"/><feMergeNode in="rough-paper"/></feMerge>
    </filter>
  </defs>
  <rect width="460" height="224" fill="#f7f2e8"/>
  <rect width="460" height="224" fill="transparent" filter="url(#paper)"/>
  <rect x="18" y="20" width="30" height="30" rx="3" fill="#f4ecdd" stroke="#cdbfa9"/>
